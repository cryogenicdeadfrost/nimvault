name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-artifacts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
            cli_name: nimvault-linux-amd64
            lib_name: libnimvault-linux-amd64.so
          - os: macos-latest
            target: macos-arm64
            cli_name: nimvault-macos-arm64
            lib_name: libnimvault-macos-arm64.dylib
          - os: windows-latest
            target: windows-amd64
            cli_name: nimvault-windows-amd64.exe
            lib_name: nimvault-windows-amd64.dll
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Nim 2.0.8
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.0.8'

      - name: Build release CLI and C-ABI artifacts
        shell: bash
        run: |
          mkdir -p dist
          nim c -d:release -d:nimvaultEmbedRoots -o:dist/${{ matrix.cli_name }} src/nimvault_cli.nim
          nim c --app:lib -d:release -d:nimvaultEmbedRoots -o:dist/${{ matrix.lib_name }} src/nimvault/cabi.nim
          ./dist/${{ matrix.cli_name }} version

      - name: Upload release assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "nimvault $TAG" --generate-notes
          gh release upload "$TAG" dist/${{ matrix.cli_name }} dist/${{ matrix.lib_name }} include/nimvault.h --clobber
